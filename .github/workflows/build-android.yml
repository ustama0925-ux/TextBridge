name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android source
        run: |
          unzip -o TextBridge_Android_v1.1_Source.zip
          cp -r TextBridge_Android_v1.1/. android-project

      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk \
          TextBridge-Android-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextBridge-Android-v1.1
          path: TextBridge-Android-v1.1.apk
